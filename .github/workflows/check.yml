name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node build.mjs
      - run: node --test tests.mjs
      - name: Verify committed workflow matches its builder
        run: git diff --exit-code -- workflows/deallens-email-to-approved-pdf.json
